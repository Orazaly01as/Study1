<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudySathi - Учёба</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg-main: #0f111a;
    --bg-sidebar: #141724;
    --bg-card: #1a1d2d;
    --bg-input: #0f111a;
    --bg-hover: #23273a;
    --border: #2a2e42;
    
    --text-main: #e2e8f0;
    --text-muted: #8b92a5;
    
    --accent: #7c5cfc;
    --accent-hover: #6b4ce6;
    --accent-gradient: linear-gradient(135deg, #a688fa, #7c5cfc);
    
    --urgent-bg: rgba(239, 68, 68, 0.15);
    --urgent-text: #ef4444;
    
    --soon-bg: rgba(245, 158, 11, 0.15);
    --soon-text: #f59e0b;
    
    --later-bg: rgba(16, 185, 129, 0.15);
    --later-text: #10b981;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    display: flex;
    min-height: 100vh;
    font-size: 14px;
  }

  /* --- Боковое меню --- */
  .sidebar {
    width: 240px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    position: fixed;
    height: 100vh;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 24px;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 30px;
    color: #fff;
  }
  .logo span { color: var(--accent); }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
    font-size: 14px;
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--text-main); }
  .nav-item.active {
    background: rgba(124, 92, 252, 0.1);
    color: var(--accent);
    border-left: 3px solid var(--accent);
    padding-left: 21px;
  }

  /* --- Основной контент --- */
  .main-content {
    margin-left: 240px;
    flex: 1;
    padding: 40px;
    max-width: 1200px;
  }

  .tab-content { display: none; animation: fadeIn 0.3s; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .page-header { margin-bottom: 30px; }
  .page-header h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 5px; }
  .page-header p { color: var(--text-muted); }

  /* --- Карточки --- */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 24px; }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; }
  .stat-card h3 { font-size: 32px; color: var(--accent); margin-bottom: 8px; }
  .stat-card p { color: var(--text-muted); font-size: 14px; }

  /* --- Форма добавления --- */
  .add-task-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }
  .add-task-card h2 { font-size: 16px; margin-bottom: 20px; color: #fff; }

  .form-grid {
    display: grid;
    grid-template-columns: 320px 1fr 160px auto;
    gap: 16px;
    align-items: end;
  }

  .input-group { display: flex; flex-direction: column; gap: 8px; }
  .input-group label { font-size: 12px; font-weight: 500; color: var(--text-muted); }
  
  input, select, textarea {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 10px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: #4a5163; }
  
  /* Стилизация выпадающего списка */
  select { 
    cursor: pointer; 
    appearance: none; 
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238b92a5%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); 
    background-repeat: no-repeat; 
    background-position: right 14px top 50%; 
    background-size: 10px auto; 
    padding-right: 30px; 
    text-overflow: ellipsis; 
    white-space: nowrap; 
    overflow: hidden; 
  }
  optgroup { font-weight: 700; color: var(--accent); background: var(--bg-card); }
  option { font-weight: normal; color: var(--text-main); background: var(--bg-main); padding: 8px; }
  
  /* Делаем иконку календаря светлой */
  input[type="date"]::-webkit-calendar-picker-indicator { 
    filter: invert(1); 
    opacity: 0.6; 
    cursor: pointer; 
  }

  .btn-add {
    background: var(--accent-gradient); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.2s, transform 0.1s; height: 40px;
  }
  .btn-add:hover { opacity: 0.9; }
  .btn-add:active { transform: scale(0.98); }

  /* --- Поиск и Фильтры --- */
  .search-bar { margin-bottom: 24px; position: relative; }
  .search-bar input { padding-left: 40px; background: var(--bg-card); border-radius: 10px; }
  .search-bar::before { content: '🔍'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.5; }

  .filters { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover { border-color: var(--text-muted); color: var(--text-main); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* --- Список задач --- */
  .task-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .task-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; align-items: flex-start; gap: 16px; transition: transform 0.2s, border-color 0.2s; animation: slideIn 0.3s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .task-item:hover { border-color: #3f4560; }

  .task-checkbox { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; color: transparent; font-size: 12px; margin-top: 2px; }
  .task-item.done .task-checkbox { background: var(--accent); border-color: var(--accent); color: #fff; }

  .task-content { flex: 1; min-width: 0; }
  .task-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  
  .tag-subject { 
    background: #2a2e42; 
    color: #a0a6b8; 
    font-size: 11px; 
    padding: 3px 8px; 
    border-radius: 4px; 
    font-weight: 600; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    max-width: 100%; 
    display: inline-block; 
  }
  
  .tag-date { color: var(--text-muted); font-size: 12px; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .badge.urgent { background: var(--urgent-bg); color: var(--urgent-text); }
  .badge.soon { background: var(--soon-bg); color: var(--soon-text); }
  .badge.later { background: var(--later-bg); color: var(--later-text); }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .task-title { font-size: 14px; color: var(--text-main); font-weight: 500; line-height: 1.5; word-wrap: break-word; }
  .task-item.done .task-title { text-decoration: line-through; color: var(--text-muted); }

  .btn-delete { background: var(--urgent-bg); color: var(--urgent-text); border: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s, background 0.2s; flex-shrink: 0; }
  .task-item:hover .btn-delete { opacity: 1; }
  .btn-delete:hover { background: rgba(239, 68, 68, 0.25); }

  .empty-state { text-align: center; padding: 40px; color: var(--text-muted); background: var(--bg-card); border: 1px dashed var(--border); border-radius: 12px; }

  @media (max-width: 900px) {
    .form-grid { grid-template-columns: 1fr; }
    .main-content { margin-left: 0; padding: 20px; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

  <!-- Боковое меню -->
  <aside class="sidebar">
    <div class="logo">
      <span>✓</span> Study<span>Sathi</span>
    </div>
    <button class="nav-item" data-tab="tab-home">🏠 Главная</button>
    <button class="nav-item active" data-tab="tab-tasks">📋 Задания</button>
    <button class="nav-item" data-tab="tab-stats">📊 Статистика</button>
  </aside>

  <!-- Основной контент -->
  <main class="main-content">
    
    <!-- Вкладка: Главная -->
    <section id="tab-home" class="tab-content">
      <div class="page-header">
        <h1>Добро пожаловать!</h1>
        <p>Твой личный помощник в учёбе</p>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <h3 id="home-total">0</h3>
          <p>Всего заданий</p>
        </div>
        <div class="stat-card">
          <h3 id="home-active" style="color: var(--soon-text);">0</h3>
          <p>Активных заданий</p>
        </div>
        <div class="stat-card">
          <h3 id="home-done" style="color: var(--later-text);">0</h3>
          <p>Выполнено</p>
        </div>
      </div>
    </section>

    <!-- Вкладка: Задания -->
    <section id="tab-tasks" class="tab-content active">
      <div class="page-header">
        <h1>Домашние задания</h1>
        <p>Управляй своими заданиями и дедлайнами</p>
      </div>

      <div class="add-task-card">
        <h2>Добавить новое задание</h2>
        <div class="form-grid">
          <div class="input-group">
            <label>Предмет</label>
            <select id="subject">
              <option value="">Выбери предмет...</option>
              
              <optgroup label="Блок 1">
                <option value="Бағдарламалық жасақтаманың әрбір модулі үшін бағдарламаның, процедураның, тіл библиотекасының құрылымын анықтау">Бағдарламалық жасақтаманың әрбір модулі үшін бағдарламаның, процедураның, тіл библиотекасының құрылымын анықтау</option>
                <option value="Төзімді және белсенді жеке ұстанымды қалыптастыратын моральдық-адамгершілік құндылықтар мен нормаларды түсіну">Төзімді және белсенді жеке ұстанымды қалыптастыратын моральдық-адамгершілік құндылықтар мен нормаларды түсіну</option>
                <option value="Әзірленіп жатқан жоба үшін бизнес-процестердің моделін әзірлеу">Әзірленіп жатқан жоба үшін бизнес-процестердің моделін әзірлеу</option>
                <option value="Web және мобильді қолданбаларды әзірлеу бойынша стандарт сервистер мен платформаларды пайдалану">Web және мобильді қолданбаларды әзірлеу бойынша стандарт сервистер мен платформаларды пайдалану</option>
              </optgroup>

              <optgroup label="Блок 2">
                <option value="Бағдарламалық жасақтаманың әртүрлі компоненттері үшін техникалық ерекшеліктер әзірлеу">Бағдарламалық жасақтаманың әртүрлі компоненттері үшін техникалық ерекшеліктер әзірлеу</option>
                <option value="Web және мобильді қосымшалардың функционалдығын жобалау үшін макеттерін жасау">Web және мобильді қосымшалардың функционалдығын жобалау үшін макеттерін жасау</option>
                <option value="Бағдарламалық өнімге қойылатын талаптарға сәйкес техникалық тапсырманы әзірлеу">Бағдарламалық өнімге қойылатын талаптарға сәйкес техникалық тапсырманы әзірлеу</option>
                <option value="Web және мобильді қолданбаларды әзірлеуде деректер базасының технологияларын қолдану">Web және мобильді қолданбаларды әзірлеуде деректер базасының технологияларын қолдану</option>
                <option value="Серверлер мен жұмыс станцияларына операциялық жүйелер мен бағдарламалық жасақтаманы орнату және конфигурациялау">Серверлер мен жұмыс станцияларына операциялық жүйелер мен бағдарламалық жасақтаманы орнату және конфигурациялау</option>
                <option value="Жүйелік қауіпсіздікті қамтамасыз ету">Жүйелік қауіпсіздікті қамтамасыз ету</option>
              </optgroup>

              <optgroup label="Блок 3">
                <option value="Дене каситтері мен психофизиологиялык кабілеттерді жетілдіру">Дене каситтері мен психофизиологиялык кабілеттерді жетілдіру</option>
                <option value="Серверлік жане клиенттік операцияльк жуйелерге кызмет корсетуді жузеге асыру">Серверлік жане клиенттік операцияльк жуйелерге кызмет корсетуді жузеге асыру</option>
                <option value="Багдарламалык жасактама модулі ушін дизайн-жобага негізделген блок-схемалар жасау">Багдарламалык жасактама модулі ушін дизайн-жобага негізделген блок-схемалар жасау</option>
              </optgroup>

              <option value="__custom">Другой предмет (ввести вручную)</option>
            </select>
          </div>
          
          <div class="input-group">
            <label>Задание (описание)</label>
            <input id="task" type="text" placeholder="Что нужно сделать?" autocomplete="off">
          </div>

          <div class="input-group">
            <label>Срок сдачи</label>
            <input id="dueDate" type="date">
          </div>

          <button class="btn-add" id="addBtn">+ Добавить</button>
        </div>
        
        <div class="input-group" id="customSubjectGroup" style="display: none; margin-top: 16px;">
          <label>Введи название своего предмета</label>
          <input id="customSubject" type="text" placeholder="Например: Физика" autocomplete="off">
        </div>
      </div>

      <div class="search-bar">
        <input id="search" type="text" placeholder="Поиск по заданиям...">
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">Все задания</button>
        <button class="filter-btn" data-filter="urgent">🔴 Срочные</button>
        <button class="filter-btn" data-filter="soon">🟡 Скоро</button>
        <button class="filter-btn" data-filter="later">🟢 Позже</button>
        <button class="filter-btn" data-filter="done">✓ Выполненные</button>
      </div>

      <ul class="task-list" id="list"></ul>
    </section>

    <!-- Вкладка: Статистика -->
    <section id="tab-stats" class="tab-content">
      <div class="page-header">
        <h1>Статистика</h1>
        <p>Твой прогресс в учёбе</p>
      </div>
      <div class="add-task-card" style="text-align: center;">
        <h2>Выполнено заданий</h2>
        <div style="font-size: 48px; font-weight: 700; color: var(--later-text); margin: 20px 0;" id="stats-percent">0%</div>
        <div style="background: var(--bg-input); height: 12px; border-radius: 10px; overflow: hidden; max-width: 400px; margin: 0 auto;">
          <div id="stats-bar" style="background: var(--accent-gradient); height: 100%; width: 0%; transition: width 0.5s ease;"></div>
        </div>
        <p style="margin-top: 20px; color: var(--text-muted);" id="stats-text">У тебя пока нет заданий</p>
      </div>
    </section>

  </main>

<script>
// === 1. НАВИГАЦИЯ ===
const navItems = document.querySelectorAll('.nav-item');
const tabContents = document.querySelectorAll('.tab-content');

navItems.forEach(btn => {
  btn.addEventListener('click', () => {
    navItems.forEach(n => n.classList.remove('active'));
    tabContents.forEach(t => t.classList.remove('active'));
    
    btn.classList.add('active');
    const tabId = btn.dataset.tab;
    document.getElementById(tabId).classList.add('active');

    if (tabId === 'tab-home' || tabId === 'tab-stats') {
      updateStats();
    }
  });
});

// === 2. ЛОГИКА ЗАДАНИЙ ===
const STORAGE_KEY = 'studysathi_tasks_kz_final_v3';
let tasks = [];
try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) tasks = JSON.parse(saved);
} catch (e) {}

let filter = 'all';
let query = '';

const $ = id => document.getElementById(id);
const list = $('list');
const subjectSelect = $('subject');
const customGroup = $('customSubjectGroup');
const customInput = $('customSubject');

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  updateStats(); 
}

function setupDateInput() {
  const dateInput = $('dueDate');
  const currentYear = new Date().getFullYear();
  dateInput.setAttribute('max', `${currentYear}-12-31`);
  const today = new Date();
  const minDate = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  dateInput.setAttribute('min', minDate);
}
setupDateInput();

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(todayStr());
  const due = new Date(dateStr);
  return Math.round((due - today) / 86400000);
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  const diff = daysUntil(dateStr);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Завтра';
  if (diff === -1) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}

subjectSelect.addEventListener('change', (e) => {
  if (e.target.value === '__custom') {
    customGroup.style.display = 'flex';
    customInput.focus();
  } else {
    customGroup.style.display = 'none';
    customInput.value = '';
  }
});

$('addBtn').addEventListener('click', () => {
  let subject = subjectSelect.value;
  
  if (subject === '__custom') {
    subject = customInput.value.trim();
  }
  
  const text = $('task').value.trim();
  const due = $('dueDate').value;

  if (!subject) { alert('Выбери или введи предмет!'); subjectSelect.focus(); return; }
  if (!text) { alert('Напиши, что задали!'); $('task').focus(); return; }

  tasks.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    subject: subject,
    text: text,
    due: due,
    done: false,
    created: Date.now()
  });

  save();
  
  subjectSelect.value = '';
  customGroup.style.display = 'none';
  customInput.value = '';
  $('task').value = '';
  $('dueDate').value = '';
  $('task').focus();
  
  render();
});

$('task').addEventListener('keydown', e => { if (e.key === 'Enter') $('addBtn').click(); });
customInput.addEventListener('keydown', e => { if (e.key === 'Enter') $('addBtn').click(); });

function render() {
  list.innerHTML = '';
  const q = query.toLowerCase();

  let visible = tasks.filter(t => {
    if (filter === 'done' && !t.done) return false;
    if (filter !== 'done' && t.done) return false;
    
    if (filter === 'urgent' || filter === 'soon' || filter === 'later') {
      const diff = daysUntil(t.due);
      if (diff === null) return false;
      if (filter === 'urgent' && (diff > 2 || diff < 0)) return false;
      if (filter === 'soon' && (diff <= 2 || diff > 7)) return false;
      if (filter === 'later' && diff <= 7) return false;
    }

    if (q) {
      const hay = (t.subject + ' ' + t.text).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  visible.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.due && b.due) return a.due.localeCompare(b.due);
    if (a.due) return -1;
    if (b.due) return 1;
    return b.created - a.created;
  });

  if (visible.length === 0) {
    list.innerHTML = `<div class="empty-state">Заданий не найдено. Самое время отдохнуть! ☕</div>`;
    return;
  }

  visible.forEach(t => {
    const li = document.createElement('li');
    li.className = `task-item ${t.done ? 'done' : ''}`;

    let badgeHtml = '';
    let dateHtml = '';
    const diff = daysUntil(t.due);
    
    if (t.due) {
      dateHtml = `<span class="tag-date">📅 ${formatDate(t.due)}</span>`;
      if (!t.done) {
        if (diff < 0) badgeHtml = `<span class="badge urgent">Просрочено</span>`;
        else if (diff <= 2) badgeHtml = `<span class="badge urgent">Срочно</span>`;
        else if (diff <= 7) badgeHtml = `<span class="badge soon">Скоро</span>`;
        else badgeHtml = `<span class="badge later">Позже</span>`;
      }
    }

    const safeSubject = t.subject.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeText = t.text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    li.innerHTML = `
      <div class="task-checkbox" data-toggle="${t.id}" title="Отметить выполненным">✓</div>
      <div class="task-content">
        <div class="task-header">
          <span class="tag-subject" title="${safeSubject}">${safeSubject}</span>
          ${dateHtml}
          ${badgeHtml}
        </div>
        <div class="task-title">${safeText}</div>
      </div>
      <button class="btn-delete" data-del="${t.id}" title="Удалить">🗑️</button>
    `;
    list.appendChild(li);
  });
}

list.addEventListener('click', (e) => {
  const toggleId = e.target.dataset.toggle;
  if (toggleId) {
    const t = tasks.find(x => x.id === toggleId);
    if (t) { t.done = !t.done; save(); render(); }
  }

  const delId = e.target.dataset.del;
  if (delId) {
    if (confirm('Точно удалить это задание?')) {
      tasks = tasks.filter(x => x.id !== delId);
      save(); render();
    }
  }
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  });
});

let searchTimer;
$('search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(() => { query = val; render(); }, 200);
});

// === 3. ОБНОВЛЕНИЕ СТАТИСТИКИ ===
function updateStats() {
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const active = total - done;
  
  if ($('home-total')) $('home-total').textContent = total;
  if ($('home-active')) $('home-active').textContent = active;
  if ($('home-done')) $('home-done').textContent = done;

  if ($('stats-percent')) {
    const percent = total === 0 ? 0 : Math.round((done / total) * 100);
    $('stats-percent').textContent = percent + '%';
    $('stats-bar').style.width = percent + '%';
    $('stats-text').textContent = total === 0 
      ? 'У тебя пока нет заданий' 
      : `Выполнено ${done} из ${total} заданий`;
  }
}

// Инициализация при загрузке
render();
updateStats();
</script>
</body>
